name: CI/CD Pipeline for AKS

on:
  push:
    branches:
      - main

env:
  REGISTRY_NAME: 'acragrostreamregistry.azurecr.io'
  CLUSTER_NAME: 'aks-agrostream'
  RESOURCE_GROUP: 'rg-agrostream'

jobs:
  lint-and-test:
    name: Lint & Test Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linting Tools
        run: |
          pip install flake8

      - name: Lint Ingestion API
        run: |
          flake8 ingestion-api/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Lint Consumer
        run: |
          flake8 consumer/ --count --select=E9,F63,F7,F82 --show-source --statistics

  build-and-push:
    name: Build and Push to ACR
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name ${{ env.REGISTRY_NAME }}

      - name: Build and Push Ingestion API
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}/ingestion-api:${{ github.sha }} ingestion-api/
          docker push ${{ env.REGISTRY_NAME }}/ingestion-api:${{ github.sha }}

      - name: Build and Push Consumer
        run: |
          docker build -t ${{ env.REGISTRY_NAME }}/telemetry-consumer:${{ github.sha }} consumer/
          docker push ${{ env.REGISTRY_NAME }}/telemetry-consumer:${{ github.sha }}

  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set AKS context
        uses: azure/aks-set-context@v3
        with:
          resource-group: ${{ env.RESOURCE_GROUP }}
          cluster-name: ${{ env.CLUSTER_NAME }}

      - name: Substitute Image Tags
        run: |
          sed -i "s|image: .*ingestion-api:.*|image: \"${{ env.REGISTRY_NAME }}/ingestion-api:${{ github.sha }}\"|g" k8s/02-ingestion-api.yaml
          sed -i "s|image: .*telemetry-consumer:.*|image: \"${{ env.REGISTRY_NAME }}/telemetry-consumer:${{ github.sha }}\"|g" k8s/03-consumer.yaml

      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/
