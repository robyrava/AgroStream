name: AgroStream CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to Azure Container Registry
      uses: azure/docker-login@v2
      with:
        login-server: ${{ secrets.ACR_LOGIN_SERVER }}
        username: ${{ secrets.ACR_USERNAME }}
        password: ${{ secrets.ACR_PASSWORD }}

    - name: Build and push Flask Ingestion
      uses: docker/build-push-action@v4
      with:
        context: ./src/flask-ingestion
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/flask-ingestion:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/flask-ingestion:latest

    - name: Build and push Kafka Consumer
      uses: docker/build-push-action@v4
      with:
        context: ./src/kafka-consumer
        push: true
        tags: ${{ secrets.ACR_LOGIN_SERVER }}/kafka-consumer:${{ github.sha }},${{ secrets.ACR_LOGIN_SERVER }}/kafka-consumer:latest

    - name: Set up Kubernetes config
      uses: azure/k8s-set-context@v3
      with:
        method: kubeconfig
        kubeconfig: ${{ secrets.KUBE_CONFIG }}

    - name: Deploy to AKS
      run: |
        # Replace ACR placeholder in k8s manifests before applying
        sed -i 's/<ACR_NAME>.azurecr.io/${{ secrets.ACR_LOGIN_SERVER }}/g' k8s/flask-deployment.yaml
        sed -i 's/<ACR_NAME>.azurecr.io/${{ secrets.ACR_LOGIN_SERVER }}/g' k8s/consumer-deployment.yaml
        kubectl apply -f k8s/
